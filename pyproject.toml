[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enerjinabiz-ai"
version = "1.0.0"
description = "Provider-agnostic Turkish electricity analytics, forecasting and BI export platform."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Faramarz Kowsari"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "plotly>=5.23",
  "openpyxl>=3.1",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "beautifulsoup4>=4.12"
]

[project.optional-dependencies]
app = ["streamlit>=1.37", "pyarrow>=17.0"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
enerjinabiz = "enerjinabiz.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
