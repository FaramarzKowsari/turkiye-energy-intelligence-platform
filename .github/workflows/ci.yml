name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,app]"
      - run: python scripts/generate_demo.py
      - run: python scripts/build_exports.py
      - run: pytest
      - run: ruff check .
