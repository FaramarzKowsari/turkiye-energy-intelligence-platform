name: Bug report
description: Report a reproducible software or data-pipeline defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider mode
      placeholder: demo, local, teias-catalog, epias
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials and tokens.
